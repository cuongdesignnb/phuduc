services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phuduc-app
    ports:
      - "8741:8741"   # php artisan serve
      - "5179:5179"   # Vite HMR
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8741
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-phuduc}
      - DB_USERNAME=${DB_USERNAME:-phuduc}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - QUEUE_CONNECTION=database
      - PHP_CLI_SERVER_WORKERS=4
      - VITE_PORT=5179
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - phuduc-net

  db:
    image: mysql:8.0
    container_name: phuduc-db
    ports:
      - "3641:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-phuduc}
      MYSQL_USER: ${DB_USERNAME:-phuduc}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - phuduc-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - phuduc-net

volumes:
  phuduc-db-data:

networks:
  phuduc-net:
    driver: bridge
